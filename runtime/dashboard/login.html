<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo Login</title>
  <script src="auth.js"></script>
  <style>
    :root {
      --paper: #fff8ea;
      --ink: #263126;
      --muted: #6d766c;
      --leaf: #4f8f61;
      --leaf-dark: #2f6e43;
      --sky: #4c91b9;
      --rose: #c84642;
      --line: #e4dccb;
      --shadow: 0 24px 60px rgba(77, 61, 35, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 210, 140, 0.5), transparent 28rem),
        radial-gradient(circle at 85% 20%, rgba(179, 220, 238, 0.7), transparent 26rem),
        linear-gradient(135deg, #fff7e5, #edf7ef);
      padding: 24px;
    }

    .card {
      width: min(440px, 100%);
      padding: 34px;
      border-radius: 34px;
      background: rgba(255, 253, 247, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .mark {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      color: white;
      font-size: 1.4rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--leaf), var(--sky));
      box-shadow: 0 16px 34px rgba(79, 143, 97, 0.3);
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -0.04em;
    }

    p {
      margin: 8px 0 24px;
      color: var(--muted);
      line-height: 1.45;
      font-weight: 600;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      font: inherit;
      outline: 0;
    }

    input:focus {
      border-color: var(--sky);
      box-shadow: 0 0 0 4px rgba(76, 145, 185, 0.14);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, var(--leaf), var(--leaf-dark));
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    button.secondary {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--line);
    }

    @media (max-width: 520px) {
      .button-row {
        grid-template-columns: 1fr;
      }
    }

    .error {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 14px;
      background: #ffe2df;
      color: var(--rose);
      font-weight: 800;
      font-size: 0.9rem;
    }

    .hint {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    code {
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(255,255,255,0.8);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">E</div>
    <h1>Echo Control Login</h1>
    <p>Operator access for Echo dashboard, mapping, navigation, and runtime controls.</p>

    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" value="ahmed" />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Enter dashboard PIN" />

      <div class="button-row">
        <button type="submit">Login as Admin</button>
        <button type="button" class="secondary" id="user-login">Login as User</button>
      </div>
      <div id="error" class="error">Wrong login. Use username ahmed and PIN 0000 for now.</div>
    </form>

    <div class="hint">Temporary local login: <code>ahmed</code> / <code>0000</code>. This is frontend-only, not real server security yet.</div>
  </main>

  <script>
    document.getElementById("login-form").addEventListener("submit", (event) => {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if ((username === "ahmed" || username === "Ahmed") && password === "0000") {
        EchoAuth.login("Ahmed");
        window.location.href = "admin.html";
        return;
      }

      document.getElementById("error").style.display = "block";
    });

    document.getElementById("user-login").addEventListener("click", () => {
      EchoAuth.login("Guest User");
      window.location.href = "user.html";
    });
  </script>
</body>
</html>
